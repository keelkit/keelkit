# Конфиг sqlc. Генерация: make generate; сгенерированный код коммитится.
# Схема — все миграции сайта; у каждого пакета свои queries.sql. Новый тип контента — новая запись.
version: "2"
sql:
  - engine: sqlite
    schema: db/migrations
    queries: internal/settings/queries.sql
    gen:
      go:
        package: settings
        out: internal/settings
        omit_unused_structs: true
  - engine: sqlite
    schema: db/migrations
    queries: internal/content/pages/queries.sql
    gen:
      go:
        package: pages
        out: internal/content/pages
        omit_unused_structs: true
  - engine: sqlite
    schema: db/migrations
    queries: internal/content/categories/queries.sql
    gen:
      go:
        package: categories
        out: internal/content/categories
        omit_unused_structs: true
  - engine: sqlite
    schema: db/migrations
    queries: internal/content/posts/queries.sql
    gen:
      go:
        package: posts
        out: internal/content/posts
        omit_unused_structs: true
  - engine: sqlite
    schema: db/migrations
    queries: internal/menu/queries.sql
    gen:
      go:
        package: menu
        out: internal/menu
        omit_unused_structs: true
  - engine: sqlite
    schema: db/migrations
    queries: internal/admin/queries.sql
    gen:
      go:
        package: admin
        out: internal/admin
        omit_unused_structs: true
