# Спецификация эталонного сайта. Проверка: make spec-validate FILE=reference/site.yaml
spec_version: 1
site:
  name: keelkit-reference
  languages: [ru]
# Модули в порядке применения миграций (migrationSources в cmd/site/main.go): images, затем сайт.
modules:
  images: v0
content:
  pages:
    fields:
      title: { type: string, required: true }
      slug:  { type: slug, required: true }
      # Набор блоков — дизайн сайта: поля блоков описаны в internal/blocks, здесь — только имена.
      body:  { type: blocks, allow: [text, image, image_text, quote, gallery] }
    features: [draft, sitemap]
  # Посты блога: черновик-копия, как у pages (feature draft); publish_date — пост виден на сайте с этого момента.
  posts:
    fields:
      title:    { type: string, required: true }
      slug:     { type: slug, required: true }
      cover:    { type: image }
      category: { type: ref, to: categories }
      body:     { type: blocks, allow: [text, image, image_text, quote, gallery] }
    features: [publish_date, draft, rss, sitemap]
  categories:
    fields:
      name: { type: string, required: true }
      slug: { type: slug, required: true }
