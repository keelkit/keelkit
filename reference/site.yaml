# Спецификация эталонного сайта. Проверка: make spec-validate FILE=reference/site.yaml
spec_version: 1
site:
  name: keelkit-reference
  languages: [ru]
# Все модули Keelkit из go.mod, в порядке применения миграций (migrationSources в cmd/site/main.go; у richtext
# миграций нет), затем миграции сайта. TestSpecModulesMatchCode сверяет список с go.mod и migrationSources.
modules:
  images: v0
  richtext: v0
# Настройки сайта — одна запись (site_settings, раздел «Настройки» в админке, пакет internal/settings);
# правки сразу на сайте. TestSpecSettingsMatchCode сверяет поля с колонками таблицы (и их порядок: новое поле — в конец).
settings:
  fields:
    name:                { type: string, required: true }
    description:         { type: text }
    share_image:         { type: image }   # картинка для соцсетей по умолчанию
    phone:               { type: string }
    email:               { type: string }
    address:             { type: text }
    cookie_text:         { type: text }    # пусто — баннера cookies нет
    cookie_link:         { type: string }
    yandex_verification: { type: string }
    google_verification: { type: string }
    # Ссылки на соцсети в подвале — поле-список (internal/listfield): элементы по порядку, у каждого название и адрес.
    social:
      type: list
      fields:
        name: { type: string, required: true }
        url:  { type: string, required: true }
# Меню, которые редактируют в админке (internal/menu, раздел «Меню» в группе «Сайт»): main — в шапке, footer —
# в подвале. Пункт ведёт на страницу, раздел сайта или свой адрес; устройство пунктов — код сайта.
# TestSpecMenusMatchCode сверяет имена с siteMenus в cmd/site/server.go.
menus: [main, footer]
content:
  pages:
    fields:
      title: { type: string, required: true }
      slug:  { type: slug, required: true }
      # Набор блоков — дизайн сайта: поля блоков описаны в internal/blocks, здесь — только имена.
      body:  { type: blocks, allow: [text, image, image_text, quote, gallery] }
    # seo — SEO записи вручную (заголовок, описание, картинка для соцсетей; пусто — подстановка),
    # только у типов со своим адресом; общий компонент internal/seofields.
    features: [draft, sitemap, seo]
  # Посты блога: черновик-копия, как у pages (feature draft); publish_date — пост виден на сайте с этого момента.
  posts:
    fields:
      title:     { type: string, required: true }
      slug:      { type: slug, required: true }
      # Лид — подзаголовок под заголовком; анонс — для ленты, RSS и описания (пусто — начало текста блоков).
      lead:      { type: text }
      excerpt:   { type: text }
      cover:     { type: image }
      cover_alt: { type: string }  # alt обложки; пусто — обложка декоративная
      category:  { type: ref, to: categories }
      body:      { type: blocks, allow: [text, image, image_text, quote, gallery] }
    features: [publish_date, draft, rss, sitemap, seo]
  categories:
    fields:
      name: { type: string, required: true }
      slug: { type: slug, required: true }
