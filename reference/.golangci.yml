# Общий минимальный конфиг golangci-lint (v2) для модулей и сайтов Keelkit.
# Копия лежит в reference/.golangci.yml: сайт в отдельном репозитории должен быть самодостаточным. Отличие копии —
# goimports.local-prefixes: свои пакеты сайта — отдельной группой импортов после внешних (create-site подставляет путь
# модуля сайта; путь без точки, например my-blog, без этого goimports отнёс бы к стандартной библиотеке).
version: "2"

run:
  # Браузерные тесты сайтов (make e2e-browser) собираются с тегом browser — линтер проверяет и их.
  build-tags:
    - browser

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
  settings:
    revive:
      rules:
        - name: exported
          disabled: true # комментарии к экспортируемым именам — на усмотрение автора
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/keelkit/keelkit/reference
