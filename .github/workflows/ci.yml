name: CI

# Пока только ручной запуск (решение человека, см. «CI» в AGENTS.md): те же проверки перед релизом
# выполняет локально make check, его вызывает make release. Автозапуск (push в main, pull_request)
# и доступ к приватным модулям (KEELKIT_DEPLOY_KEY или GITHUB_TOKEN) — этап 14 в PLAN.md.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [images, spec, reference]
    env:
      # Тулчейн берётся из go.work/go.mod (директива toolchain).
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
      # Приватные модули keelkit берутся из git по SSH (GOPRIVATE и insteadOf — в Makefile).
      # Ключ — deploy key этого репозитория только для чтения, секрет KEELKIT_DEPLOY_KEY.
      # Ключ github.com уже есть в known_hosts раннера.
      - name: SSH agent for private modules
        env:
          DEPLOY_KEY: ${{ secrets.KEELKIT_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::warning::KEELKIT_DEPLOY_KEY не задан: зависимости от опубликованных модулей keelkit не скачаются"
            exit 0
          fi
          eval "$(ssh-agent -s)"
          echo "$DEPLOY_KEY" | ssh-add -
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
      - name: Lint
        run: make lint MODULE=${{ matrix.module }}
      - name: Test
        run: make test MODULE=${{ matrix.module }}
      - name: Test (GOWORK=off)
        run: make test-isolated MODULE=${{ matrix.module }}
      - name: Dependencies (updates, govulncheck)
        run: make deps-check MODULE=${{ matrix.module }}
      - name: Generate check
        if: matrix.module == 'reference'
        run: make generate-check
      - name: E2E
        if: matrix.module == 'reference'
        run: make e2e
      # Chrome предустановлен на ubuntu-latest.
      - name: E2E (browser)
        if: matrix.module == 'reference'
        run: make e2e-browser
      - name: Validate reference/site.yaml
        if: matrix.module == 'spec'
        run: make spec-validate FILE=reference/site.yaml
