name: Evals

# Эвалы скиллов плагина keelkit (skills/evals/README.md): вызовы LLM — долго и платно, поэтому только вручную,
# обязательно перед релизом плагина. Нужен секрет репозитория ANTHROPIC_API_KEY.
on:
  workflow_dispatch:
    inputs:
      skill:
        description: Скилл
        type: choice
        options: [create-site, upgrade-site]
        required: true
      case:
        description: Кейс (пусто — все кейсы скилла)
        type: string
        default: ""
      model:
        description: Модель агента (пусто — по умолчанию Claude Code)
        type: string
        default: ""
      budget:
        description: Предел в долларах на кейс
        type: string
        default: "40"

permissions:
  contents: read

env:
  # Версия Claude Code закреплена, как любой инструмент (AGENTS.md, «Зависимости»).
  CLAUDE_CODE_VERSION: 2.1.302

jobs:
  evals:
    name: ${{ inputs.skill }} ${{ inputs.case }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GOTOOLCHAIN: auto
      EVALS_OUT: ${{ runner.temp }}/keelkit-evals
    steps:
      # Вся история: кейс upgrade-site берёт эталон со старого коммита, create-site — с HEAD.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
      - name: Claude Code
        run: npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
      # Агент и setup.sh коммитят в git сайта.
      - name: Git identity
        run: |
          git config --global user.name keelkit-evals
          git config --global user.email evals@keelkit.invalid
      # Chrome для make e2e-browser сайта предустановлен на ubuntu-latest.
      - name: Evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SKILL: ${{ inputs.skill }}
          CASE: ${{ inputs.case }}
          MODEL: ${{ inputs.model }}
          BUDGET: ${{ inputs.budget }}
        run: make evals SKILL="$SKILL" CASE="$CASE" MODEL="$MODEL" BUDGET="$BUDGET" KEEP=0
      - name: Report
        if: always()
        run: cat "$EVALS_OUT"/*/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evals-${{ inputs.skill }}
          path: ${{ env.EVALS_OUT }}
